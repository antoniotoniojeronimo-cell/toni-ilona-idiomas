name: Construir APK TONI ILONA V2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Descomprimir proyecto
        run: |
          unzip -o TONI_ILONA_APLICACION_DEFINITIVA_V4.zip

      - name: Compilar APK
        working-directory: TONI_ILONA_DEFINITIVA_V2
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TONI-ILONA-APK
          path: TONI_ILONA_DEFINITIVA_V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
