<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TONI ❤️ ILONA — Idiomas</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0001;margin:14px 0}
h1{font-size:28px;margin:0 0 6px}h2{margin:4px 0 12px}.sub{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap}
button,input{font:inherit;border-radius:13px;padding:12px 14px;border:1px solid #ccd3dc}
button{border:0;background:#202938;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}input{text-transform:uppercase;width:180px}
.big{font-size:25px;font-weight:800;text-align:center;padding:18px;border-radius:18px;background:#f2f5f9;margin:15px 0}
.answers{display:grid;gap:10px}.answers button{background:#fff;color:#17202a;border:2px solid #d8dee7;text-align:left}
.score{display:flex;justify-content:space-between;font-weight:800}.ok{color:#087443;font-weight:800}.bad{color:#b42318;font-weight:800}
.hidden{display:none}.small{font-size:13px;color:#667085}.status{margin-top:16px;padding:12px;border-radius:12px;background:#f2f5f9;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🇪🇸🇬🇧 TONI ❤️ ILONA</h1>
    <div class="sub">Juego de idiomas — España 🇪🇸 ↔ Letonia 🇱🇻</div>
  </div>

  <div id="home" class="card">
    <h2>🎮 Entrar a jugar</h2>
    <p>Elige quién eres:</p>
    <div class="row">
      <button type="button" id="toniBtn">TONI 🇪🇸 → 🇬🇧</button>
      <button type="button" id="ilonaBtn">ILONA 🇱🇻 → 🇪🇸</button>
    </div>
    <div id="roleInfo" class="sub" style="margin-top:12px"></div>
    <hr style="border:0;border-top:1px solid #eee;margin:18px 0">
    <h3>Crear sala</h3>
    <button type="button" id="createBtn" disabled>Crear sala</button>
    <div style="margin-top:16px">
      <h3>Unirse a una sala</h3>
      <div class="row">
        <input id="roomInput" maxlength="6" placeholder="CÓDIGO" autocomplete="off">
        <button type="button" id="joinBtn" disabled>Unirse</button>
      </div>
    </div>
    <div id="status" class="status">⏳ Cargando Firebase…</div>
  </div>

  <div id="game" class="card hidden">
    <div class="score">
      <span>TONI 🇬🇧 <span id="toniScore">0</span></span>
      <span>ILONA 🇪🇸 <span id="ilonaScore">0</span></span>
    </div>
    <div id="roomLabel" class="small" style="margin-top:8px"></div>
    <div id="turnLabel" style="margin-top:15px;font-weight:800"></div>
    <div id="question" class="big"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" style="margin-top:14px;min-height:24px"></div>
    <div id="nextBox" class="hidden" style="margin-top:14px">
      <button type="button" id="nextBtn">➡️ Siguiente</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, set, update, get, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpGK5V-myz-j9JA0OJAkU3jo6vqLC9tm8",
  authDomain: "toni-ilona-idiomas.firebaseapp.com",
  databaseURL: "https://toni-ilona-idiomas-default-rtdb.firebaseio.com",
  projectId: "toni-ilona-idiomas",
  storageBucket: "toni-ilona-idiomas.firebasestorage.app",
  messagingSenderId: "491346563702",
  appId: "1:491346563702:web:c6821775efb0282198c557"
};

const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;
let db, role = null, room = null, roomData = null, unsubscribe = null;

const rounds = [
 {role:"TONI",q:"Traduce al inglés: «Hola»",a:["Hello","Goodbye","Thanks"],correct:0},
 {role:"ILONA",q:"Español: «Labdien!» significa…",a:["Hola / Buenos días","Adiós","Gracias"],correct:0},
 {role:"TONI",q:"Traduce al inglés: «Gracias»",a:["Please","Thanks","Sorry"],correct:1},
 {role:"ILONA",q:"Español: «Adiós» significa…",a:["Paldies","Sveiki","Uz redzēšanos"],correct:2},
 {role:"TONI",q:"Traduce al inglés: «Sí»",a:["No","Yes","Maybe"],correct:1},
 {role:"ILONA",q:"Español: «No» significa…",a:["Jā","Nē","Lūdzu"],correct:1},
 {role:"TONI",q:"Traduce al inglés: «Tengo hambre»",a:["I am hungry","I am happy","I am tired"],correct:0},
 {role:"ILONA",q:"Español: «Tengo sueño» significa…",a:["Man ir auksti","Man ir miegs / tengo sueño","Es esmu izsalcis"],correct:1},
 {role:"TONI",q:"Traduce al inglés: «Te quiero»",a:["I love you","I like you","See you"],correct:0},
 {role:"ILONA",q:"Español: «Te quiero» significa…",a:["Es tevi mīlu","Es nezinu","Uz redzēšanos"],correct:0},
 {role:"TONI",q:"Traduce al inglés: «¿Cómo estás?»",a:["What is your name?","How are you?","Where are you?"],correct:1},
 {role:"ILONA",q:"Español: «Me llamo Ilona» significa…",a:["Mani sauc Ilona","Es esmu no Spānijas","Man ir labi"],correct:0}
];

$("toniBtn").addEventListener("click", () => selectRole("TONI"));
$("ilonaBtn").addEventListener("click", () => selectRole("ILONA"));
$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);
$("nextBtn").addEventListener("click", nextRound);

function selectRole(r){
  role = r;
  $("roleInfo").innerHTML = r === "TONI"
    ? "TONI: vas a practicar <b>inglés</b>. 🇪🇸 → 🇬🇧"
    : "ILONA: tu apoyo es el <b>letón</b> y vas a practicar español. 🇱🇻 → 🇪🇸";
  status("🟢 " + r + " seleccionado. Ya puedes crear o unirte a una sala.");
}

function makeCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

async function createRoom(){
  status("⏳ Creando sala…");
  if(!db){ status("❌ Firebase todavía no está listo."); return; }
  if(!role){ status("❌ Primero elige TONI o ILONA."); return; }

  const c = makeCode();
  const data = {
    toni:null, ilona:null, round:0, toniScore:0, ilonaScore:0,
    answeredBy:null, answer:null, correct:null, finished:false
  };
  data[role.toLowerCase()] = "connected";

  try{
    await Promise.race([
      set(ref(db,"rooms/"+c), data),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firebase tardó más de 8 segundos en responder.")),8000))
    ]);
    room = c;
    listen();
    $("home").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("roomLabel").textContent = "Sala: " + room + " · Tú eres " + role;
    status("🎉 Sala creada: " + c);
  }catch(e){
    status("❌ ERROR AL CREAR: " + (e?.message || String(e)));
    console.error(e);
  }
}

async function joinRoom(){
  status("⏳ Buscando sala…");
  if(!db){status("❌ Firebase todavía no está listo.");return;}
  if(!role){status("❌ Primero elige TONI o ILONA.");return;}
  const c=$("roomInput").value.trim().toUpperCase();
  if(c.length!==6){status("❌ El código debe tener 6 caracteres.");return;}
  try{
    const snap=await get(ref(db,"rooms/"+c));
    if(!snap.exists()){status("❌ No existe esa sala.");return;}
    const data=snap.val(), key=role.toLowerCase();
    if(data[key]){status("❌ Ese jugador ya está ocupado.");return;}
    await update(ref(db,"rooms/"+c),{[key]:"connected"});
    room=c; listen();
    $("home").classList.add("hidden"); $("game").classList.remove("hidden");
    $("roomLabel").textContent="Sala: "+room+" · Tú eres "+role;
  }catch(e){status("❌ ERROR AL UNIRSE: "+(e?.message||String(e)));console.error(e);}
}

function listen(){
  if(unsubscribe) unsubscribe();
  unsubscribe=onValue(ref(db,"rooms/"+room), snap=>{
    if(!snap.exists()){status("❌ La sala ya no existe.");return;}
    roomData=snap.val(); render();
  }, err=>status("❌ ERROR DE CONEXIÓN: "+err.message));
}

function render(){
  if(!roomData)return;
  $("toniScore").textContent=roomData.toniScore||0;
  $("ilonaScore").textContent=roomData.ilonaScore||0;
  const r=rounds[roomData.round||0];
  if(!r){endGame();return;}
  const both=roomData.toni==="connected"&&roomData.ilona==="connected";
  $("turnLabel").textContent=!both
    ?"⏳ Esperando a "+(role==="TONI"?"ILONA 🇪🇸":"TONI 🇬🇧")+"…"
    :role===r.role?"🔥 ¡Te toca a ti!":"⏳ Turno de "+r.role+"…";
  $("question").textContent=r.q;
  const box=$("answers");box.innerHTML="";
  r.a.forEach((ans,i)=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=ans;
    b.disabled=!both||role!==r.role||!!roomData.answeredBy;
    b.addEventListener("click",()=>answer(i));
    box.appendChild(b);
  });
  if(roomData.answeredBy){
    $("feedback").innerHTML=roomData.correct
      ?"<span class='ok'>✅ ¡Correcto!</span>"
      :"<span class='bad'>❌ Casi. La correcta era: <b>"+escapeHtml(r.a[r.correct])+"</b></span>";
    $("nextBox").classList.toggle("hidden",role!==r.role);
  }else{
    $("feedback").textContent="";
    $("nextBox").classList.add("hidden");
  }
}

async function answer(i){
  const r=rounds[roomData.round];
  if(role!==r.role||roomData.answeredBy)return;
  const correct=i===r.correct;
  const patch={answeredBy:role,answer:i,correct};
  if(correct)patch[role==="TONI"?"toniScore":"ilonaScore"]=(roomData[role==="TONI"?"toniScore":"ilonaScore"]||0)+1;
  await update(ref(db,"rooms/"+room),patch);
}

async function nextRound(){
  if(!roomData||role!==rounds[roomData.round].role||!roomData.answeredBy)return;
  await update(ref(db,"rooms/"+room),{round:(roomData.round||0)+1,answeredBy:null,answer:null,correct:null});
}

function endGame(){
  $("question").textContent="🏆 ¡Fin del juego!";
  $("answers").innerHTML="";
  $("feedback").innerHTML="<b>TONI: "+(roomData.toniScore||0)+" puntos · ILONA: "+(roomData.ilonaScore||0)+" puntos</b>";
  $("nextBox").classList.add("hidden");
  $("turnLabel").textContent="🎉 ¡Partida terminada!";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

try{
  const app=initializeApp(firebaseConfig);
  db=getDatabase(app);
  $("createBtn").disabled=false;
  $("joinBtn").disabled=false;
  status("🟢 Firebase listo. Elige TONI o ILONA.");
}catch(e){
  status("❌ ERROR AL INICIAR FIREBASE: "+(e?.message||String(e)));
  console.error(e);
}
</script>
</body>
</html>
