<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TONI ❤️ ILONA — Idiomas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff7ed,#eef2ff);color:#172033}
.app{max-width:820px;margin:auto;padding:22px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 35px #0001;margin:14px 0}
h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 12px}.sub{color:#667085}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{padding:16px;border-radius:18px;background:#f8fafc;border:2px solid transparent}.active{border-color:#7c3aed;background:#faf5ff}.score{font-size:34px;font-weight:800}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:13px}.buttons{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:#e5e7eb}.btn.primary{background:#7c3aed;color:white}.btn.good{background:#16a34a;color:white}.btn.bad{background:#dc2626;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.question{font-size:28px;font-weight:800;margin:18px 0}.answers{display:grid;gap:10px}.answer{text-align:left;font-size:18px}.hidden{display:none}.room{font-family:ui-monospace,monospace;font-size:28px;letter-spacing:4px}.small{font-size:13px;color:#667085}.status{font-weight:700}.ok{color:#15803d}.warn{color:#b45309}@media(max-width:600px){.players{grid-template-columns:1fr}.question{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>🇪🇸🇬🇧 TONI ❤️ ILONA</h1>
    <div class="sub">Dos personas, dos países, un juego de idiomas.</div>
  </div>

  <div class="card" id="setup">
    <h2>1. Conectaros</h2>
    <p class="small">Una persona crea la sala y comparte el código. La otra lo introduce. No hace falta estar en el mismo lugar.</p>
    <div class="buttons">
      <button class="btn primary" onclick="createRoom()">Crear sala</button>
      <button class="btn" onclick="showJoin()">Unirse a una sala</button>
    </div>
    <div id="joinBox" class="hidden" style="margin-top:15px">
      <input id="roomInput" placeholder="Código de sala" style="padding:13px;border-radius:12px;border:1px solid #ccc;width:100%;font-size:18px;text-transform:uppercase">
      <button class="btn primary" onclick="joinRoom()" style="margin-top:10px">Entrar</button>
    </div>
    <div id="roomInfo" class="hidden" style="margin-top:15px">
      <div class="small">Comparte este código con la otra persona:</div>
      <div class="room" id="roomCode"></div>
    </div>
    <div id="status" class="status">Desconectado</div>
  </div>

  <div class="card hidden" id="identity">
    <h2>2. ¿Quién eres?</h2>
    <div class="buttons">
      <button class="btn primary" onclick="choose('TONI')">TONI 🇪🇸→🇬🇧</button>
      <button class="btn primary" onclick="choose('ILONA')">ILONA 🇱🇻→🇪🇸</button>
    </div>
  </div>

  <div class="card hidden" id="game">
    <div class="players">
      <div class="player" id="toniBox"><b>TONI 🇬🇧</b><div class="score" id="toniScore">0</div></div>
      <div class="player" id="ilonaBox"><b>ILONA 🇪🇸</b><div class="score" id="ilonaScore">0</div></div>
    </div>
    <p style="margin-bottom:4px">Turno:</p><div id="turn" class="pill"></div>
    <div id="q" class="question"></div>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="status"></p>
    <button id="next" class="btn primary hidden" onclick="nextQuestion()">Siguiente ronda →</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const questions=[
 {p:"TONI",q:"¿Qué significa “Hello”? 🇬🇧",a:["Adiós","Hola","Gracias"],c:1},
 {p:"ILONA",q:"🇪🇸 “Hola” nozīmē… 🇱🇻",a:["Ardievu","Paldies","Sveiki"],c:2},
 {p:"TONI",q:"¿Qué significa “Apple”? 🍎",a:["Casa","Manzana","Agua"],c:1},
 {p:"ILONA",q:"🇪🇸 “Manzana” ir… 🇱🇻",a:["Ābols","Ūdens","Māja"],c:0},
 {p:"TONI",q:"¿Qué significa “Bye”? 👋",a:["Hola","Adiós","Amor"],c:1},
 {p:"ILONA",q:"🇪🇸 “Gracias” ir… 🇱🇻",a:["Sveiki","Paldies","Ardievu"],c:1},
 {p:"TONI",q:"¿Qué significa “Water”? 💧",a:["Agua","Comida","Casa"],c:0},
 {p:"ILONA",q:"🇪🇸 “Agua” ir… 🇱🇻",a:["Ābols","Ūdens","Māja"],c:1},
 {p:"TONI",q:"¿Qué significa “Love”? ❤️",a:["Feliz","Amor","Amigo"],c:1},
 {p:"ILONA",q:"🇪🇸 “Amor” ir… 🇱🇻",a:["Mīlestība","Ūdens","Draugs"],c:0}
];

let peer,conn,host=false,me=null,state={turn:0,score:{TONI:0,ILONA:0},idx:0,answered:false};

const $=id=>document.getElementById(id);
function setStatus(t,cls=""){ $("status").textContent=t; $("status").className="status "+cls; }
function createRoom(){
 host=true; peer=new Peer();
 peer.on('open',id=>{
   const code=id.slice(-6).toUpperCase(); $("roomCode").textContent=code;
   $("roomInfo").classList.remove("hidden"); setStatus("Esperando a la otra persona…","warn");
   peer.on('connection',c=>{conn=c; wire(); showIdentity();});
 });
 peer.on('error',e=>setStatus("No se pudo crear la sala: "+e.type,"warn"));
}
function showJoin(){ $("joinBox").classList.remove("hidden"); }
function joinRoom(){
 const code=$("roomInput").value.trim().toLowerCase();
 if(!code)return;
 // Peer IDs are not guaranteed to be the last 6 chars, so we use a small deterministic room peer ID.
 // The creator actually uses a room peer ID below.
}
function createRoom(){
 host=true;
 const code=Math.random().toString(36).slice(2,8).toUpperCase();
 peer=new Peer("toni-ilona-"+code.toLowerCase());
 peer.on('open',()=>{ $("roomCode").textContent=code; $("roomInfo").classList.remove("hidden"); setStatus("Sala creada. Comparte el código.","ok");});
 peer.on('connection',c=>{conn=c;wire();showIdentity();});
 peer.on('error',e=>setStatus("Error de conexión: "+e.type,"warn"));
}
function joinRoom(){
 const code=$("roomInput").value.trim().toLowerCase();
 if(!code)return;
 peer=new Peer();
 peer.on('open',()=>{conn=peer.connect("toni-ilona-"+code); wire(); conn.on('open',()=>{showIdentity(); send({type:"hello"});});});
 peer.on('error',e=>setStatus("No se encontró esa sala. Comprueba el código.","warn"));
}
function wire(){
 conn.on('open',()=>{setStatus("Conectados ❤️","ok"); showIdentity();});
 conn.on('data',msg=>handle(msg));
}
function send(x){if(conn&&conn.open)conn.send(x)}
function showIdentity(){ $("identity").classList.remove("hidden"); }
function choose(who){
 if(me)return;
 me=who; $("identity").classList.add("hidden"); $("game").classList.remove("hidden");
 send({type:"identity",who});
 render();
}
function handle(msg){
 if(msg.type==="identity"){ $("identity").classList.add("hidden"); $("game").classList.remove("hidden"); render();}
 if(msg.type==="state"){state=msg.state;render();}
 if(msg.type==="hello"){send({type:"state",state});}
}
function render(){
 const x=questions[state.idx%questions.length];
 $("toniScore").textContent=state.score.TONI;
 $("ilonaScore").textContent=state.score.ILONA;
 $("turn").textContent= x.p==="TONI" ? "TONI 🇪🇸 → 🇬🇧" : "ILONA 🇱🇻 → 🇪🇸";
 $("toniBox").classList.toggle("active",x.p==="TONI");
 $("ilonaBox").classList.toggle("active",x.p==="ILONA");
 $("q").textContent=x.q;
 $("feedback").textContent="";
 $("next").classList.add("hidden");
 const wrap=$("answers");wrap.innerHTML="";
 x.a.forEach((ans,i)=>{
   const b=document.createElement("button"); b.className="btn answer"; b.textContent=(String.fromCharCode(65+i)+") "+ans);
   b.disabled=state.answered || !me || me!==x.p;
   b.onclick=()=>answer(i);
   wrap.appendChild(b);
 });
}
function answer(i){
 const x=questions[state.idx%questions.length];
 if(state.answered || me!==x.p)return;
 state.answered=true;
 const good=i===x.c;
 if(good)state.score[me]++;
 $("feedback").textContent=good?"🎉 ¡Correcto! +1 punto":"💡 Casi. La respuesta correcta era: "+x.a[x.c];
 $("feedback").className="status "+(good?"ok":"warn");
 $("next").classList.remove("hidden");
 send({type:"state",state});
 render();
}
function nextQuestion(){
 state.idx++; state.answered=false; send({type:"state",state}); render();
}
</script>
</body>
</html>
